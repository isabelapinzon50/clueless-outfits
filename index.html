<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>..:: Cher's Wardrobe ::..</title>
    <meta
      name="description"
      content="Recreación interactiva de la computadora que usa Cher Horowitz en Clueless (1995) para elegir sus outfits."
    />

    
    <meta property="og:locale" content="es_CO" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cher's Wardrobe · Clueless Outfit Generator" />

   
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />

   
    <link rel="stylesheet" href="estilo.css" />


    <script src="script.js" defer></script>
  </head>

  <body>
    <main id="contenedorGeneral">
   
      <div id="monitor">
        <div id="pantalla">
        
          <header id="encabezado">
            <span class="etiqueta" id="etiquetaIzq">CHER'S WARDROBE</span>
            <span class="etiqueta" id="etiquetaDer">FALL FASHIONS</span>
          </header>

          <section id="zonaCentral">
        
            <div class="panel" id="panelPrincipal">
              <figure class="ranura" data-categoria="top">
                <span class="nombreRanura">TOP</span>
                <img class="prenda" id="imgTop" alt="Parte de arriba" />
              </figure>
              <div class="controles" data-categoria="top">
                <button class="flecha" data-accion="prev" aria-label="Anterior parte de arriba">◀◀</button>
                <button class="flecha" data-accion="rand" aria-label="Parte de arriba al azar">▶</button>
                <button class="flecha" data-accion="next" aria-label="Siguiente parte de arriba">▶▶</button>
              </div>

              <figure class="ranura" data-categoria="falda">
                <span class="nombreRanura">BOTTOM</span>
                <img class="prenda" id="imgFalda" alt="Parte de abajo" />
              </figure>
              <div class="controles" data-categoria="falda">
                <button class="flecha" data-accion="prev" aria-label="Anterior parte de abajo">◀◀</button>
                <button class="flecha" data-accion="rand" aria-label="Parte de abajo al azar">▶</button>
                <button class="flecha" data-accion="next" aria-label="Siguiente parte de abajo">▶▶</button>
              </div>

              <div id="resultado" hidden>
                <div id="bandaResultado"></div>
                <img id="fotoResultado" alt="" hidden />
                <p id="textoResultado"></p>
              </div>
            </div>

        
            <div class="panel" id="panelLateral">
              <figure class="ranura ranuraChica" data-categoria="zapatos">
                <span class="nombreRanura">SHOES</span>
                <img class="prenda" id="imgZapatos" alt="Zapatos" />
              </figure>
              <div class="controles" data-categoria="zapatos">
                <button class="flecha" data-accion="prev" aria-label="Anteriores zapatos">◀◀</button>
                <button class="flecha" data-accion="rand" aria-label="Zapatos al azar">▶</button>
                <button class="flecha" data-accion="next" aria-label="Siguientes zapatos">▶▶</button>
              </div>

              <figure class="ranura ranuraChica" data-categoria="acc">
                <span class="nombreRanura">ACCESSORY</span>
                <img class="prenda" id="imgAcc" alt="Accesorio" />
              </figure>
              <div class="controles" data-categoria="acc">
                <button class="flecha" data-accion="prev" aria-label="Anterior accesorio">◀◀</button>
                <button class="flecha" data-accion="rand" aria-label="Accesorio al azar">▶</button>
                <button class="flecha" data-accion="next" aria-label="Siguiente accesorio">▶▶</button>
              </div>
            </div>
          </section>

          
          <nav id="botones">
            <button class="botonGrande" id="botonBrowse">BROWSE</button>
            <button class="botonGrande" id="botonAuto">AUTO DRESS</button>
            <button class="botonGrande" id="botonDressMe">DRESS ME</button>
          </nav>

       
          <p id="estado" aria-live="polite">LOADING WARDROBE...</p>

      
          <footer id="barraCategorias">
            <span>SHOES</span><span>JEWELRY</span><span>SCARVES</span><span>PANTYHOSE</span
            ><span>UNDERWEAR</span><span>PANTS</span><span>SWEATERS</span><span>MORE</span>
          </footer>
        </div>

     
        <div id="bisel">
          <span id="marca">H O R O W I T Z · 95</span>
          <div id="botonesBisel">
            <button id="botonSonido" class="botonFisico" aria-pressed="true" title="Efectos de sonido">SFX ON</button>
            <button id="botonMusica" class="botonFisico" aria-pressed="false" title="Música de la página">♪ MUSIC</button>
          </div>
        </div>
      </div>

     
      <div id="musica" hidden></div>
    </main>
  </body>
</html>
